name: Nightly Sitemap Generator

on:
  schedule:
    # Runs every day at 2:00 AM UTC (5:30 AM Iran Standard Time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-push-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository (main branch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚙️ Install dependencies
        run: npm ci || npm install

      - name: 🗺️ Generate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: 🚀 Commit & push if sitemap changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml sitemap.xml
          if git diff --staged --quiet; then
            echo "✅ No changes detected in sitemap.xml"
          else
            git commit -m "chore(seo): automated nightly sitemap.xml update [skip ci]"
            git push origin main
            echo "🚀 Successfully pushed updated sitemap to main branch!"
          fi
