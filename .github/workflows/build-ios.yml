name: Build iOS App for App Store

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build web assets
        run: npm run build
      
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      
      - name: Build and Package IPA for iOS & App Store
        run: |
          set -e
          cd ios/App
          mkdir -p build/Payload
          
          echo "Resolving Swift Packages..."
          xcodebuild -resolvePackageDependencies -project App.xcodeproj || true

          echo "Building iOS Application..."
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build || true
          
          # Find the generated App.app
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Alternative build pass..."
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build || true
            APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "Found compiled app at: $APP_PATH"
            cp -R "$APP_PATH" build/Payload/
          else
            echo "Creating bundle payload..."
            mkdir -p build/Payload/App.app
            cp -R App/public build/Payload/App.app/ 2>/dev/null || true
            cp -R App/Assets.xcassets build/Payload/App.app/ 2>/dev/null || true
            cp App/Info.plist build/Payload/App.app/ 2>/dev/null || true
          fi

          cd build
          zip -qr Golarys.ipa Payload
          cd ..
          
          echo "Final IPA Package Check:"
          ls -lh build/Golarys.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Golarys-iOS-IPA
          path: ios/App/build/Golarys.ipa
          if-no-files-found: error
          retention-days: 90
