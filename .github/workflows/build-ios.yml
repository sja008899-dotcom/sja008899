name: Build iOS App for App Store

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build web assets
        run: npm run build
      
      - name: Setup iOS build
        run: |
          cd ios
          pod install
      
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo $CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security import certificate.p12 -k ~/Library/Keychains/login.keychain-db -P $CERTIFICATE_PASSWORD -T /usr/bin/codesign
      
      - name: Import provisioning profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE }}
        run: |
          echo $PROVISION_PROFILE_BASE64 | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      
      - name: Build IPA
        run: |
          cd ios/App
          xcodebuild archive \
            -scheme CapApp \
            -configuration Release \
            -archivePath build/CapApp.xcarchive
          
          xcodebuild -exportArchive \
            -archivePath build/CapApp.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/
      
      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          xcrun altool --upload-app \
            --file build/CapApp.ipa \
            --type ios \
            --apiKey $APP_STORE_CONNECT_API_KEY
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: CapApp.ipa
          path: ios/App/build/CapApp.ipa
